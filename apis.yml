aid: project-canary
name: Project Canary
description: >-
  Project Canary is a Denver-based climate technology company that helps oil and gas
  operators and natural gas utilities turn methane emissions data into operational
  intelligence. Founded in 2019, its Canary SENSE platform unifies measurement data
  from sensors, satellites, aircraft, SCADA, and field teams into a single view that
  drives decisions, reduces costs, and supports regulatory reporting (OGMP 2.0 and
  other frameworks). The company builds high-precision methane detection hardware
  (Canary RECON, Aeris PICO) and a proprietary predictive emissions model (methaneML)
  trained on a multi-year, high-fidelity methane dataset, serving upstream and midstream
  operators as well as gas distribution utilities across the United States. Project
  Canary has raised $121M (Series B) and was surfaced as a portfolio company of Insight
  Partners and Techstars. No public API, developer portal, SDK, or OpenAPI is published
  at this time; this profile captures identity, a verbatim llms.txt, and security posture.
